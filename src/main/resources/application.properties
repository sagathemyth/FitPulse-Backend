spring.application.name=fitness-workout

# H2 file-based database — persists to ./data/fitnessdb.mv.db so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/fitnessdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console (handy for viewing your DB in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080